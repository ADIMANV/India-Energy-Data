    <style>
        #chart-container {
            position: relative;
            height: auto;
            border: 0px solid #aaa;
            margin: 0.5rem;
            overflow: auto;
            text-align: center;
        }

        .dataTables_filter {
            display: none;
        }

        .folder {
            width: 80px;
            height: 42px;
            margin: 0 auto;
            margin-top: 30px;
            position: relative;
            background-color: #FAD462;
            border-radius: 0 6px 6px 6px;
            box-shadow: 4px 4px 5px rgba(0, 0, 0, 0.59);
        }

        .folder:before {
            content: '';
            width: 50%;
            height: 12px;
            border-radius: 0 20px 0 0;
            background-color: #FAD462;
            position: absolute;
            top: -12px;
            left: 0px;
        }

        .grey-background {
            background-color: grey;
        }

        .grey-background:before {
            background-color: grey;
        }

        #errMsg,
        #fileError,
        .errMsgRename {
            color: red;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* autosuggestion CSS */
        .suggestionsList {
            list-style: none;
            padding: 0;
            margin: 0;
            background: #fff;
            border: 1px solid #ccc;
            max-height: 150px;
            overflow-y: auto;
        }

        .suggestionsList li {
            padding: 8px;
            cursor: pointer;
        }

        .suggestionsList li:hover {
            background-color: #f1f1f1;
        }
    </style>
